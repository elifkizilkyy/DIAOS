name: Task
description: A unit of work for the DIAOS project
title: "[Task]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done and why, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Break the work into steps.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      value: |
        - [ ]
  - type: input
    id: requirement
    attributes:
      label: Related requirement
      description: Requirement ID from docs/requirements.md, if any.
      placeholder: REQ-F-01
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: GitHub username of the person who reviews the pull request. Set the assignee in the sidebar.
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: due-date
    attributes:
      label: Due date
      placeholder: YYYY-MM-DD
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      options:
        - S (a few hours)
        - M (about a day)
        - L (several days)
